# tms-frontend 운영 nginx — SPA 정적 서빙 + 백엔드 리버스 프록시(동일 출처).
# 공개 진입점(:80). /api/v1 와 /api/v1/ws 는 compose 네트워크의 app:8080 으로 전달.

upstream tms_api {
    server app:8080;
}

# WebSocket: Upgrade 헤더가 있으면 "upgrade", 없으면 close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 업로드 용량(파일 첨부 대비)
    client_max_body_size 50m;

    # gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/font-woff2 font/woff2;

    # 해시 버스팅된 정적 에셋 — 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 백엔드 API (REST + WebSocket 동일 prefix)
    location /api/v1/ {
        proxy_pass http://tms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket(/api/v1/ws) 업그레이드 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # WS/SSE 장시간 연결 타임아웃
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 백엔드 헬스체크 패스스루(선택 — curl http://IP/health)
    location = /health {
        proxy_pass http://tms_api/health;
        proxy_set_header Host $host;
    }

    # SPA 폴백 — 알 수 없는 경로는 index.html (React Router 가 처리)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
